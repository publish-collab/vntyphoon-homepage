<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNTYPHOON</title>
  <meta name="description" content="" />
  <meta name="theme-color" content="#f7f4ed" />
  <link rel="icon" href="/favicon.ico?v=20260719b" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260719b" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260719b" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260719b" />
  <link rel="stylesheet" href="styles.css" />
  <script>document.documentElement.classList.add("js-enabled");</script>
  <script src="locales.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip.content"></a>

  <header class="site-header" data-header>
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="" data-i18n-aria-label="brand.home">
        <span class="brand-mark" aria-hidden="true">
          <img src="../assets/logo/vntyphoon-wing-v-transparent.png" width="1098" height="653" alt="" />
        </span>
        <span class="brand-name">VNTYPHOON COMPANY LIMITED</span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
        <span data-i18n="nav.menu"></span>
        <span class="nav-toggle-lines" aria-hidden="true"><i></i><i></i></span>
      </button>

      <nav class="primary-nav" id="primary-navigation" aria-label="" data-i18n-aria-label="nav.primary" data-nav>
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#philosophy" data-i18n="nav.philosophy"></a>
        <a href="#apps" data-i18n="nav.apps"></a>
        <a href="#build" data-i18n="nav.build"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
        <div class="language-selector" role="group" aria-label="" data-i18n-aria-label="language.selector">
          <button type="button" data-language="vi" aria-pressed="false" aria-label="" data-i18n-aria-label="language.vi">VI</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-language="en" aria-pressed="false" aria-label="" data-i18n-aria-label="language.en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="shell hero-grid">
        <div class="hero-copy">
          <p class="kicker hero-enter" style="--enter-delay: 40ms" data-i18n="hero.kicker"></p>
          <h1 class="hero-enter" id="hero-title" style="--enter-delay: 100ms" data-i18n-lines="hero.title"></h1>
          <p class="hero-intro hero-enter" style="--enter-delay: 170ms" data-i18n="hero.intro"></p>
          <div class="hero-actions hero-enter" style="--enter-delay: 230ms">
            <a class="button button-primary" href="#apps" data-i18n="hero.primaryAction"></a>
            <a class="text-link" href="#about"><span data-i18n="hero.secondaryAction"></span> <span aria-hidden="true">↘</span></a>
          </div>
        </div>

        <figure class="hero-visual hero-enter" style="--enter-delay: 180ms" aria-labelledby="hero-visual-caption" data-drift="0.24">
          <div class="editorial-orbit orbit-one" aria-hidden="true"></div>
          <div class="editorial-orbit orbit-two" aria-hidden="true"></div>

          <div class="phone phone-timtim" aria-label="" data-i18n-aria-label="hero.timtimLabel">
            <div class="phone-bar"><span>09:41</span><span aria-hidden="true">•••</span></div>
            <div class="phone-screen">
              <div class="app-mini-brand"><span class="app-dot timtim-dot"></span><strong>TimTim</strong></div>
              <p class="phone-lead" data-i18n="hero.timtimLead"></p>
              <div class="profile-pair" aria-hidden="true">
                <span></span><i></i><span></span>
              </div>
              <div class="message-lines" aria-hidden="true"><i></i><i></i><i></i></div>
            </div>
          </div>

          <div class="phone phone-tarot" aria-label="" data-i18n-aria-label="hero.tarotLabel">
            <div class="phone-bar"><span>09:41</span><span aria-hidden="true">•••</span></div>
            <div class="phone-screen">
              <div class="app-mini-brand"><span class="app-dot tarot-dot"></span><strong>Tarot Queen</strong></div>
              <p class="phone-overline" data-i18n="hero.tarotOverline"></p>
              <div class="tarot-card-symbol" aria-hidden="true"><span>✦</span></div>
              <p class="phone-note" data-i18n="hero.tarotNote"></p>
            </div>
          </div>

          <figcaption id="hero-visual-caption" data-i18n="hero.caption"></figcaption>
        </figure>
      </div>
      <div class="hero-index shell" aria-hidden="true"><span>VNT / 2026</span><i></i><span>H2H</span></div>
    </section>

    <section class="section about" id="about" aria-labelledby="about-title">
      <div class="shell editorial-split">
        <div class="section-label reveal">
          <p class="kicker" data-i18n="about.kicker"></p>
          <span>01</span>
        </div>
        <div class="editorial-content">
          <h2 class="statement reveal" id="about-title" data-i18n-lines="about.title"></h2>
          <div class="two-column-copy reveal">
            <p data-i18n="about.bodyOne"></p>
            <p data-i18n="about.bodyTwo"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section philosophy" id="philosophy" aria-labelledby="philosophy-title">
      <div class="shell philosophy-layout">
        <div class="philosophy-title reveal">
          <p class="kicker" data-i18n="philosophy.kicker"></p>
          <h2 id="philosophy-title" data-i18n-lines="philosophy.title"></h2>
        </div>
        <div class="philosophy-copy reveal">
          <p class="philosophy-lead" data-i18n="philosophy.lead"></p>
          <p data-i18n="philosophy.body"></p>
          <div class="principle-line" aria-label="" data-i18n-aria-label="philosophy.principlesLabel">
            <span data-i18n="philosophy.clarity"></span><i></i><span data-i18n="philosophy.care"></span><i></i><span data-i18n="philosophy.connection"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="section apps" id="apps" aria-labelledby="apps-title">
      <div class="shell">
        <header class="apps-heading reveal">
          <div>
            <p class="kicker" data-i18n="apps.kicker"></p>
            <h2 id="apps-title" data-i18n-lines="apps.title"></h2>
          </div>
          <p data-i18n="apps.intro"></p>
        </header>

        <article class="app-story app-timtim">
          <div class="app-copy reveal">
            <p class="app-number">01 / TimTim</p>
            <div class="app-title-line">
              <h3>TimTim</h3>
              <span data-i18n="apps.status"></span>
            </div>
            <p class="app-description" data-i18n="apps.timtimDescription"></p>
            <nav class="app-policy-links" aria-label="" data-i18n-aria-label="apps.timtimPoliciesLabel">
              <a href="../timtim-privacy/" data-i18n="apps.privacy"></a>
              <a href="../timtim-terms/" data-i18n="apps.terms"></a>
              <a href="../timtim-account-deletion/" data-i18n="apps.accountDeletion"></a>
            </nav>
          </div>
          <figure class="app-visual timtim-visual reveal" data-drift="0.14">
            <div class="visual-window" aria-hidden="true">
              <div class="visual-heading"><span class="app-dot timtim-dot"></span><strong data-i18n="apps.timtimVisualHeading"></strong></div>
              <div class="connection-map"><span></span><i></i><span></span><i></i><span></span></div>
              <div class="conversation-card"><small data-i18n="apps.timtimVisualLabel"></small><strong data-i18n="apps.timtimVisualMessage"></strong></div>
            </div>
            <figcaption data-i18n="apps.timtimCaption"></figcaption>
          </figure>
        </article>

        <article class="app-story app-tarot">
          <div class="app-copy reveal">
            <p class="app-number">02 / Tarot Queen</p>
            <div class="app-title-line">
              <h3>Tarot Queen</h3>
              <span data-i18n="apps.status"></span>
            </div>
            <p class="app-description" data-i18n="apps.tarotDescription"></p>
            <nav class="app-policy-links" aria-label="" data-i18n-aria-label="apps.tarotPoliciesLabel">
              <a href="../tarot-queen-privacy/" data-i18n="apps.privacy"></a>
              <a href="../tarot-queen-terms/" data-i18n="apps.terms"></a>
              <a href="../tarot-queen-account-deletion/" data-i18n="apps.accountDeletion"></a>
            </nav>
          </div>
          <figure class="app-visual tarot-visual reveal" data-drift="0.14">
            <div class="visual-window" aria-hidden="true">
              <div class="tarot-spread"><span>II</span><span>✦</span><span>VI</span></div>
              <p class="tarot-caption" data-i18n="apps.tarotVisualMessage"></p>
            </div>
            <figcaption data-i18n="apps.tarotCaption"></figcaption>
          </figure>
        </article>
      </div>
    </section>

    <section class="section build" id="build" aria-labelledby="build-title">
      <div class="shell build-layout">
        <header class="build-heading reveal">
          <p class="kicker" data-i18n="build.kicker"></p>
          <h2 id="build-title" data-i18n-lines="build.title"></h2>
        </header>
        <ol class="build-stages">
          <li class="reveal"><span>01</span><h3 data-i18n="build.discoverTitle"></h3><p data-i18n="build.discoverBody"></p></li>
          <li class="reveal"><span>02</span><h3 data-i18n="build.designTitle"></h3><p data-i18n="build.designBody"></p></li>
          <li class="reveal"><span>03</span><h3 data-i18n="build.buildTitle"></h3><p data-i18n="build.buildBody"></p></li>
          <li class="reveal"><span>04</span><h3 data-i18n="build.operateTitle"></h3><p data-i18n="build.operateBody"></p></li>
        </ol>
      </div>
    </section>

    <section class="vision" aria-labelledby="vision-title">
      <div class="shell reveal">
        <p class="kicker" data-i18n="vision.kicker"></p>
        <h2 id="vision-title" data-i18n-lines="vision.title"></h2>
      </div>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <div class="shell contact-layout">
        <div class="reveal">
          <p class="kicker" data-i18n="contact.kicker"></p>
          <h2 id="contact-title" data-i18n-lines="contact.title"></h2>
        </div>
        <div class="contact-action reveal">
          <p class="contact-intro" data-i18n="contact.body"></p>
          <ul class="contact-topics" aria-label="" data-i18n-aria-label="contact.topicsLabel">
            <li data-i18n="contact.topicPartnerships"></li>
            <li data-i18n="contact.topicSupport"></li>
            <li data-i18n="contact.topicMedia"></li>
          </ul>
          <a class="email-link" href="mailto:contact@vntyphoon.com">contact@vntyphoon.com <span aria-hidden="true">↗</span></a>
          <p class="contact-response" data-i18n="contact.responseTime"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="policies">
    <div class="shell footer-panel">
      <div class="footer-grid">
        <section class="footer-company" aria-labelledby="footer-company-title">
          <div class="footer-brand">
            <span class="footer-brand-mark" aria-hidden="true">
              <img src="../assets/logo/vntyphoon-wing-v-transparent.png" width="1098" height="653" alt="" />
            </span>
            <div>
              <strong id="footer-company-title">VNTYPHOON COMPANY LIMITED</strong>
            </div>
          </div>
          <a class="footer-email" href="mailto:contact@vntyphoon.com">contact@vntyphoon.com</a>
          <p class="footer-description" data-i18n="footer.description"></p>
        </section>

        <nav class="footer-navigation" aria-labelledby="footer-navigation-title">
          <p class="footer-column-title" id="footer-navigation-title" data-i18n="footer.navigationLabel"></p>
          <a href="#about" data-i18n="nav.about"></a>
          <a href="#philosophy" data-i18n="nav.philosophy"></a>
          <a href="#apps" data-i18n="nav.apps"></a>
          <a href="#build" data-i18n="nav.build"></a>
          <a href="#contact" data-i18n="nav.contact"></a>
        </nav>

        <nav class="policy-group" aria-labelledby="footer-timtim-title">
          <p id="footer-timtim-title">TimTim</p>
          <a href="../timtim-privacy/" data-i18n="footer.privacy"></a>
          <a href="../timtim-terms/" data-i18n="footer.terms"></a>
          <a href="../timtim-account-deletion/" data-i18n="footer.accountDeletion"></a>
        </nav>

        <nav class="policy-group" aria-labelledby="footer-tarot-title">
          <p id="footer-tarot-title">Tarot Queen</p>
          <a href="../tarot-queen-privacy/" data-i18n="footer.privacy"></a>
          <a href="../tarot-queen-terms/" data-i18n="footer.terms"></a>
          <a href="../tarot-queen-account-deletion/" data-i18n="footer.accountDeletion"></a>
        </nav>
      </div>

      <div class="footer-bottom">
        <p>© 2026 VNTYPHOON COMPANY LIMITED</p>
        <p data-i18n="footer.statement"></p>
        <a class="footer-top-link" href="#top">
          <span data-i18n="footer.backToTop"></span>
          <span aria-hidden="true">↑</span>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
