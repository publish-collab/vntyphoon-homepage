<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VNTYPHOON</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="../" />
  <link rel="icon" href="/favicon.ico?v=20260719b" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260719b" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260719b" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260719b" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #f7f4ed;
      color: #102233;
    }

    main {
      width: min(100% - 2rem, 560px);
      text-align: center;
    }

    a {
      color: #075cb7;
      font-weight: 700;
      text-underline-offset: 0.25em;
    }

    a:focus-visible {
      outline: 3px solid #1476d4;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <p>Đang chuyển đến trang chủ VNTYPHOON</p>
    <a href="../" data-compatibility-link>Tiếp tục đến trang chủ</a>
  </main>
  <script>
    (() => {
      const target = new URL("../", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      document.querySelector("[data-compatibility-link]").href = target.href;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
